{# Month / Agenda toggle. hse_nav.js routes .hse-tab clicks as SPA swaps.
   Month passes view=month explicitly: without a view, phones open on
   Agenda (hse_calendar.js). #}
{% macro calendar_tabs(active_view) %}
<div class="tab-strip">
    <a class="tab-strip-item hse-tab{{ ' active' if active_view == 'month' else '' }}"
       href="{{ url_for('hse.calendar_month', view='month') }}">Month</a>
    <a class="tab-strip-item hse-tab{{ ' active' if active_view == 'agenda' else '' }}"
       href="{{ url_for('hse.calendar_month', view='agenda') }}">Agenda</a>
</div>
{% endmacro %}
