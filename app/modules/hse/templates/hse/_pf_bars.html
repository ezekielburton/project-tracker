{# Planned vs completed bars, drawn server-side so they print to PDF. Shared
   by the page and the report. No height attribute: the viewBox sets it, so
   the chart fills the card's width. #}
<svg class="hse-pf-svg" viewBox="0 0 {{ bars.width }} {{ bars.height }}"
     width="100%" role="img"
     aria-label="{{ bars.aria }}">
    {% for g in bars.gridlines %}
    <line x1="0" y1="{{ g.y }}" x2="{{ bars.width }}" y2="{{ g.y }}" class="hse-pf-grid"/>
    <text x="0" y="{{ g.y - 5 }}" class="hse-pf-axis"
          style="font-size: {{ bars.axis_font }}px">{{ g.value }}</text>
    {% endfor %}
    {% for b in bars.bars %}
    <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="4"
          class="hse-pf-bar hse-pf-bar--{{ b.series }}"/>
    {% if b.label %}
    <text x="{{ b.label_x }}" y="{{ bars.label_y }}" class="hse-pf-tick"
          style="font-size: {{ bars.tick_font }}px" text-anchor="middle">{{ b.label }}</text>
    {% endif %}
    {% endfor %}
</svg>
