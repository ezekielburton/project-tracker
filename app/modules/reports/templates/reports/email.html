{# Report email. Inline styles only: email clients ignore <style> blocks. #}
{% set kind = 'Weekly' if period.kind == 'weekly' else 'Monthly' %}
{% set ns = namespace(idle=0) %}
{% for run in runs %}{% set ns.idle = [ns.idle, (run.summary or {}).get('no_activity', 0)]|max %}{% endfor %}
{% macro change(value) -%}
  {%- if value -%}<span style="font-family:monospace;font-size:12px;padding:1px 6px;border-radius:4px;{{ 'color:#2E7D45;background:#E5F2E8' if value > 0 else 'color:#B3392F;background:#F8E3E0' }}">{{ '▲' if value > 0 else '▼' }}{{ value|abs }}</span>{%- endif -%}
{%- endmacro %}
<div style="background:#F7F4EE;padding:24px;font-family:'Public Sans',Arial,sans-serif;color:#3C362E;">
  <div style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #E3DBCD;border-radius:12px;padding:26px 28px;">
    <div style="border-bottom:3px solid #F27F55;padding-bottom:12px;margin-bottom:18px;">
      <span style="font-family:'Barlow Condensed',Arial Narrow,sans-serif;font-weight:700;font-size:30px;color:#F27F55;">V</span>
      <span style="font-family:'Barlow Condensed',Arial Narrow,sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.5px;color:#1F1B16;margin-left:8px;">{{ kind }} {{ 'report' if runs|length == 1 else 'reports' }}</span>
    </div>
    <p style="margin:0 0 18px;font-size:14px;line-height:1.5;">{{ period.label }}: attached.</p>
    <table style="width:100%;border-collapse:collapse;border:1px solid #E3DBCD;border-radius:10px;font-size:14px;">
      {% for run in runs %}{% set d = run.summary or {} %}
      <tr style="{{ 'background:#FBF8F3;' if run.report == 'consolidated' }}">
        <td style="padding:10px 14px;border-bottom:1px solid #EFE9DE;font-weight:600;color:#1F1B16;">{{ 'Company adoption score' if run.report == 'consolidated' else reports[run.report] }}</td>
        <td style="padding:10px 14px;border-bottom:1px solid #EFE9DE;text-align:right;font-family:monospace;color:#1F1B16;">{{ d.score }}%</td>
        <td style="padding:10px 14px;border-bottom:1px solid #EFE9DE;text-align:right;width:56px;">{{ change(d.change) }}</td>
      </tr>
      {% endfor %}
    </table>
    {% if ns.idle %}
    <p style="margin:16px 0 0;font-size:13px;"><span style="color:#B3392F;">●</span> {{ ns.idle }} {{ 'person' if ns.idle == 1 else 'people' }} with no activity.</p>
    {% endif %}
    {% if link %}
    <p style="margin:20px 0 0;"><a href="{{ link }}" style="display:inline-block;background:#F27F55;color:#211B13;font-weight:600;font-size:13px;border-radius:8px;padding:10px 16px;text-decoration:none;">Open in OVP</a></p>
    {% endif %}
  </div>
</div>
