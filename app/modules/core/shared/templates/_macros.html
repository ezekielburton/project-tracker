{# Avatar macros. user_avatar() is the clickable,
badge-aware avatar most templates want. #}

{% macro user_avatar_visual(user, size='sm') %}
{# Circle + badge with no link, for use inside an interactive element
    (e.g. a <button>), where a nested link is invalid. #}
        <span class="user-avatar-link user-avatar--{{ size }}" title="{{ user.name }}">
            {% if user.avatar_filename %}
            <img src="{{ url_for('static', filename='avatars/' + user.avatar_filename) }}" class="user-avatar-img"
                alt="">
            {% else %}
            <span class="user-avatar-initials">{{ user.name[0].upper() }}</span>
            {% endif %}

            {% if size != 'xs' %}
            {% set badge_img = active_badge_image(user) %}
            {% if badge_img %}
            <img class="user-avatar-badge" src="{{ url_for('static', filename='achievements/' + badge_img) }}" alt="">
            {% endif %}
            {% endif %}
        </span>
        {% endmacro %}

        {% macro user_avatar(user, size='sm') %}
        {# The avatar, linked to the user's profile. #}
        <a href="{{ url_for('profile.view', user_id=user.id) }}" class="user-avatar-link-wrap"
            style="text-decoration:none; display:inline-flex;">
            {{ user_avatar_visual(user, size) }}
        </a>
        {% endmacro %}
